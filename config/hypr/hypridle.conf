general {
    lock_cmd = hk-lock                                        # launch the separate Quickshell locker
    before_sleep_cmd = loginctl lock-session                        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})' && brightnessctl -r  # restore display
    inhibit_sleep = 3
}

listener {
    timeout = 360                                             # 6min.
    on-timeout = brightnessctl -s set 10                      # set monitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                              # monitor backlight restore
}

listener {
    timeout = 450                                             # 7.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})' && brightnessctl -r  # screen on when activity is detected after timeout has fired
}

listener {
    timeout = 480                                             # 8min
    on-timeout = hk-suspend                             # suspend when timeout has passed
}
