  typography:
    uiFamily: JetBrains Mono Nerd Font Propo
    monoFamily: JetBrains Mono Nerd Font
    bodySize: 13
    readoutSize: 13
    weight: 700
    style: Bold
  metrics:
    radius: 8
    borderWidth: 2
    controlPadding: 8
  bar:
    minimumThickness: 22
    showDividers: true
    widgetPadding:
      main: 6
      cross: 3
    trayPaddingOffset: -2
    margin:
      screen: 0
      outer: 0
      content: 0
    island:
      radius: 8
      curveSize: 12
      curveRadius: 4
      corners:
        screenOuter: square
        screenInner: curve
        contentOuter: square
        contentInner: round
      borders:
        screen: false
        content: true
        outer: false
        inner: true
  panel:
    gap: 0
    width: 360
    powerWidth: 300
    padding: 12
    spacing: 10
    radius: 10
    transitionDuration: 140
  tooltip:
    radius: 6
  osd:
    width: 300
    mediaWidth: 380
    padding: 12
    spacing: 10
    radius: 10
    iconSize: 20
    progressHeight: 6
    transitionDuration: 140
  notification:
    width: 420
    compactWidth: 210
    padding: 10
    spacing: 8
    stackSpacing: 0
    radius: 10
    iconSize: 32
    indicatorScale: 1.5
    progressHeight: 6
    transitionDuration: 140
  polkit:
    width: 440
    padding: 14
    spacing: 10
    radius: 10
    iconSize: 36
    headerAccentOpacity: 0.3
    transitionDuration: 140
  menu:
    scrim: '#22000000'
    fontSize: 14
    width: 280
    searchWidth: 560
    referenceWidth: 800
    searchRows: 10
    outerRadius: 10
    innerRadius: 6
    entryRadius: 4
    outerBorderWidth: 2
    outerPadding: 6
    innerBorderWidth: 2
    headerPadding: 6
    entryMargin: 4
    entryPadding: 7
    selectionBorderWidth: 1
    headerAccentOpacity: 0.3
    selectionAccentOpacity: 0.16
