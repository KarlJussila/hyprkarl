typography:
  ui_family: "JetBrains Mono Nerd Font Propo"
  mono_family: "JetBrains Mono Nerd Font"
  body_size: 13
  readout_size: "{{typography.body_size}}"
  weight: 700
  style: "Bold"

desktop:
  icon_theme: "Yaru-purple"
  cursor_theme: "Adwaita"

metrics:
  spacing:
    compact: 3
    small: 6
    medium: 8
    large: 10
    xlarge: 12
    xxlarge: 14
  radius:
    entry: 4
    tooltip: 6
    control: 8
    popup: 10
  border:
    standard: 2
    subtle: 1
  opacity:
    header_accent: 0.3
    selection_accent: 0.16

motion:
  surface: 140

wallpaper:
  generate_default: false
  background: "{{base.background}}"
  accent: "{{accent.primary.base}}"
  accent_dim: "{{accent.primary.soft}}"

fastfetch:
  logo:
    mark: "{{accent.primary.bright}}"
    wordmark: "{{accent.secondary.bright}}"
  labels: "{{accent.tertiary.base}}"
  title: "{{accent.primary.bright}}"
  modules:
    - title
    - separator
    - os
    - host
    - kernel
    - uptime
    - packages
    - shell
    - display
    - wm
    - cpu
    - gpu
    - memory
    - disk
    - break
    - colors

shell:
  palette:
    foreground: "{{ui.text_secondary}}"
    muted: "{{base.foreground_muted}}"
    accent: "{{accent.primary.bright}}"
    border: "{{base.layer4}}"
    urgent: "{{status.error}}"
    warning: "{{status.warning}}"

  surfaces:
    window: "#00000000"
    bar: "{{base.background}}"
    popup: "{{base.background}}"
    tooltip: "{{base.background}}"
    notification: "{{base.background}}"
    control: "#00000000"

  typography:
    uiFamily: "{{typography.ui_family}}"
    monoFamily: "{{typography.mono_family}}"
    bodySize: "{{typography.body_size}}"
    readoutSize: "{{typography.readout_size}}"
    weight: "{{typography.weight}}"
    style: "{{typography.style}}"

  metrics:
    radius: "{{metrics.radius.control}}"
    borderWidth: "{{metrics.border.standard}}"
    controlPadding: "{{metrics.spacing.medium}}"

  switch:
    trackLength: 24
    trackHeight: 12
    trackRadius: 6
    thumbSize: 16
    thumbRadius: 8
    thumbPadding: 7
    borderWidth: "{{metrics.border.standard}}"
    filled: false
    fontFamily: "{{shell.typography.uiFamily}}"
    fontSize: 9
    onGlyphOffset: [0, 0]
    offGlyphOffset: [0, 0]
    transitionDuration: "{{motion.surface}}"

  bar:
    minimumThickness: 22
    showDividers: true
    widgetPadding:
      main: "{{metrics.spacing.small}}"
      cross: "{{metrics.spacing.compact}}"
    trayPaddingOffset: -2
    margin:
      screen: 0
      outer: 0
      content: 0
    island:
      radius: "{{metrics.radius.control}}"
      curveSize: "{{metrics.spacing.xlarge}}"
      curveRadius: "{{metrics.radius.entry}}"
      corners:
        screenOuter: "square"
        screenInner: "curve"
        contentOuter: "square"
        contentInner: "round"
      borders:
        screen: false
        content: true
        outer: false
        inner: true

  panel:
    gap: 0
    width: 360
    powerWidth: 320
    padding: "{{metrics.spacing.xlarge}}"
    spacing: "{{metrics.spacing.large}}"
    background: "{{shell.surfaces.popup}}"
    sectionBackground: "{{base.surface_soft}}"
    foreground: "{{shell.palette.foreground}}"
    accent: "{{shell.palette.accent}}"
    border: "{{shell.palette.border}}"
    font: "{{shell.typography.uiFamily}}"
    fontSize: "{{shell.typography.bodySize}}"
    fontWeight: "{{shell.typography.weight}}"
    outerRadius: "{{metrics.radius.popup}}"
    innerRadius: "{{metrics.radius.tooltip}}"
    entryRadius: "{{metrics.radius.entry}}"
    outerBorderWidth: "{{metrics.border.standard}}"
    outerPadding: "{{metrics.spacing.small}}"
    innerBorderWidth: "{{metrics.border.standard}}"
    headerPadding: "{{metrics.spacing.small}}"
    entryPadding: "{{metrics.spacing.medium}}"
    selectionBorderWidth: "{{metrics.border.subtle}}"
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    selectionAccentOpacity: "{{metrics.opacity.selection_accent}}"
    transitionDuration: "{{motion.surface}}"

  tooltip:
    radius: "{{metrics.radius.tooltip}}"

  osd:
    width: 300
    mediaWidth: 380
    padding: "{{metrics.spacing.xlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    iconSize: 20
    progressHeight: "{{metrics.spacing.small}}"
    transitionDuration: "{{motion.surface}}"

  notification:
    width: 420
    compactWidth: "{{shell.notification.width // 2}}"
    padding: "{{metrics.spacing.large}}"
    spacing: "{{metrics.spacing.medium}}"
    stackSpacing: 0
    radius: "{{metrics.radius.popup}}"
    iconSize: 32
    indicatorScale: 1.5
    progressHeight: "{{metrics.spacing.small}}"
    transitionDuration: "{{motion.surface}}"

  polkit:
    width: 440
    padding: "{{metrics.spacing.xxlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    iconSize: 36
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    transitionDuration: "{{motion.surface}}"

  lock:
    width: 400
    padding: "{{metrics.spacing.xxlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    inputHeight: 64
    inputFontSize: 28
    clockFontSize: 64
    dateFontSize: 24
    dimOpacity: 0.6
    clockFormat: "hh:mm AP"
    dateFormat: "dddd, MMMM d"
    transitionDuration: "{{motion.surface}}"
    fadeDuration: 300
    failureDuration: 1000
    fingerprintSize: 40
    fingerprintCompleteDuration: 450

  menu:
    background: "{{shell.surfaces.popup}}"
    foreground: "{{shell.palette.foreground}}"
    accent: "{{shell.palette.accent}}"
    border: "{{shell.palette.border}}"
    scrim: "#22000000"
    font: "{{shell.typography.uiFamily}}"
    fontSize: 14
    fontWeight: "{{shell.typography.weight}}"
    width: 280
    searchWidth: "{{shell.menu.width * 2}}"
    referenceWidth: 800
    searchRows: 10
    outerRadius: "{{metrics.radius.popup}}"
    innerRadius: "{{metrics.radius.tooltip}}"
    entryRadius: "{{metrics.radius.entry}}"
    outerBorderWidth: "{{metrics.border.standard}}"
    outerPadding: "{{metrics.spacing.small}}"
    innerBorderWidth: "{{metrics.border.standard}}"
    headerPadding: "{{metrics.spacing.small}}"
    entryMargin: "{{metrics.radius.entry}}"
    entryPadding: 7
    selectionBorderWidth: "{{metrics.border.subtle}}"
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    selectionAccentOpacity: "{{metrics.opacity.selection_accent}}"

  applicationPicker:
    width: 400
    rows: 7
    iconSize: 32

  calculator:
    width: 480
    historyRows: 5

  wallpaperPicker:
    widthScreenFraction: 0.82
    previewHeightScreenFraction: 0.42
    previewAspectRatio: 1.7777777778
    carouselRadiusWidthFraction: 0.48
    sideScale: 0.78
    sideOpacity: 0.55
    gap: "{{metrics.spacing.xxlarge}}"

  displayArrangement:
    width: 960
    height: 600
    bezelFraction: 0.08
