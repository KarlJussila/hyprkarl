# Theme-specific colors and optional token overrides.
mode: dark

desktop:
  icon_theme: "Yaru-sage"

base:
  background: "#282828"

  layer0: "{{base.background}}"
  layer1: "#302c29"
  layer2: "#3b3530"
  layer3: "#47403a"
  layer4: "#524942"

  surface_soft: "{{base.layer1}}"
  surface: "{{base.layer2}}"
  surface_alt: "{{base.layer4}}"

  foreground: "#d4be98"
  foreground_muted: "#a89984"
  foreground_dim: "#928374"

ansi:
  black: "#665c54"
  red: "#ea6962"
  green: "#a9b665"
  yellow: "#e78a4e"
  blue: "#7daea3"
  magenta: "#d3869b"
  cyan: "#89b482"
  white: "#d4be98"

bright:
  black: "#928374"
  red: "{{ansi.red}}"
  green: "{{ansi.green}}"
  yellow: "#d8a657"
  blue: "{{ansi.blue}}"
  magenta: "{{ansi.magenta}}"
  cyan: "{{ansi.cyan}}"
  white: "{{ansi.white}}"

accent:
  primary:
    base: "{{ansi.yellow}}"     # core gruvbox identity
    soft: "{{darken(accent.primary.base,25)}}"
    bright: "{{bright.yellow}}"

  secondary:
    base: "{{ansi.blue}}"         # main contrast color
    soft: "{{darken(accent.secondary.base,25)}}"
    bright: "{{bright.blue}}"

  tertiary:
    base: "{{ansi.green}}"        # semantic / calm accent
    soft: "{{darken(accent.tertiary.base,25)}}"
    bright: "{{bright.green}}"

status:
  success: "{{accent.tertiary.base}}"   # green
  warning: "{{accent.primary.base}}"    # yellow
  error: "{{ansi.red}}"
  urgent: "{{bright.red}}"

ui:
  cursor: "#a89984"

  text: "{{base.foreground}}"
  text_secondary: "{{accent.tertiary.base}}"

  selection_bg: "{{base.layer4}}"
  selection_fg: "{{base.foreground}}"

  panel: "{{base.surface}}"

  border: "{{accent.primary.base}}"
  border_inner: "#665c54"
  border_soft: "{{accent.primary.soft}}"

  highlight: "{{accent.primary.bright}}"
