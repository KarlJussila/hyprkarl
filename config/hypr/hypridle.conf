# Hyprkarl's idle and sleep behavior. Put personal changes in
# ~/.config/hypr/hypridle.local.conf: redefine any variable below, override a
# general value, or add your own listeners. Set a *_cmd variable to nothing to
# turn that step off.

$dim_timeout = 360
$dim_cmd = brightnessctl -s set 10
$undim_cmd = brightnessctl -r
$screen_off_timeout = 450
$screen_off_cmd = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
$screen_on_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})' && brightnessctl -r
$suspend_timeout = 480
$suspend_cmd = hk-suspend

general {
    lock_cmd = hk-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $screen_on_cmd
    # Hold suspend until the lock screen is up.
    inhibit_sleep = 3
}

# Sourced here so its variables reach the listeners below and its general
# values win over the ones above.
source = ~/.config/hypr/hypridle.local.conf

listener {
    timeout = $dim_timeout
    on-timeout = $dim_cmd
    on-resume = $undim_cmd
}

listener {
    timeout = $screen_off_timeout
    on-timeout = $screen_off_cmd
    on-resume = $screen_on_cmd
}

listener {
    timeout = $suspend_timeout
    on-timeout = $suspend_cmd
}
